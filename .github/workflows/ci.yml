name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers starts Postgres, Redis, LocalStack, and OpenSearch on the
      # runner's Docker daemon. `test` does not need Node (the SPA build is only
      # wired into bootJar/bootRun).
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: build/reports/tests/test
          retention-days: 7

  frontend:
    name: Storefront (typecheck, tests, builds)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (Spring Boot /app bundle)
        run: npm run build
      - name: Build (static demo, VITE_DEMO=1)
        run: npm run build:demo
